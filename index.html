  <body>
    <main class="container">
      <header class="header">
        <div class="badge">
          <span></span>
          CONTACT MANAGER
        </div>

        <h1>My Contacts</h1>
        <p>Keep your important contacts organized in one place.</p>
      </header>

      <!-- Add Contact Form -->
      <section class="form-card">
        <div class="form-title">
          <div class="form-icon">+</div>

          <div>
            <h2>Add New Contact</h2>
            <p>Enter the contact details below</p>
          </div>
        </div>

        <form class="form">
          <div class="field">
            <label>FULL NAME</label>

            <div class="input-wrap">
              <span class="input-icon">♙</span>
              <input type="text" id="nameInp" placeholder="e.g. Ahmed Khan" />
            </div>
          </div>

          <div class="field">
            <label>EMAIL ADDRESS</label>

            <div class="input-wrap">
              <span class="input-icon">✉</span>
              <input type="email" id="emailInp" placeholder="ahmed@example.com" />
            </div>
          </div>

          <button id="addBtn" >+ Add Contact</button>
        </form>
      </section>
